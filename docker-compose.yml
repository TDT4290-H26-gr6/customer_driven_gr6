services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKEND_PORT: ${BACKEND_PORT}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
      # Optional in development — see .env.example.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # AI advice on the results page — off when LLM_API_KEY is unset.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # Which content to load ("fake" by default, or "wp2"), and the Moodle
      # site placeholder links are built from — see .env.example.
      SEED_DATASET: ${SEED_DATASET:-}
      MOODLE_BASE_URL: ${MOODLE_BASE_URL:-}
      # tsx watch's file watcher misses bind-mount changes on Docker
      # Desktop/Windows (native fs events don't cross the mount) — same
      # class of issue the frontend's vite.config.ts already works around
      # with `watch: { usePolling: true }`.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${BACKEND_PORT}:4000"
      - "5555:5555"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      # The Vite dev server with hot reload. The VM uses the "prod" target
      # instead — see docker-compose.prod.yml.
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  mysql_data: