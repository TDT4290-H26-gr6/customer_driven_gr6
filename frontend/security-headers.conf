# Security headers for every response, included in each location of
# nginx.conf (a location's own add_header drops the server's). The rest of
# the Content-Security-Policy is a <meta> tag in index.html (see
# src/config/contentSecurityPolicy.ts), which can't set frame-ancestors.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
