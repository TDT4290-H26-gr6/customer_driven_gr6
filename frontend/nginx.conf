# Serves the production build (Dockerfile target "prod").
server {
    listen 5173;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Built JS/CSS have a content hash in their names (index-DcUBtAzX.js), so
    # they can be cached for good: a new build means new file names.
    location ~ "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The PIE player's runtime files keep their own, unhashed names (see
    # copyPieRuntimeFiles in vite.config.ts): revalidated on each load.
    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Everything else is a client-side route: serve the app and let React
    # Router handle it. index.html is never cached, so a new build is picked
    # up on the next page load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
